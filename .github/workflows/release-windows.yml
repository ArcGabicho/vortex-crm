name: Release Windows (MSIX para Microsoft Store)

# Se ejecuta al publicar un tag de versión (por ejemplo v0.1.0) o manualmente.
# Genera paquetes MSIX sin firmar: Microsoft Store los firma con su propio
# certificado al publicarlos, así que no hace falta comprar uno.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (major.minor.build), por ejemplo 0.1.0'
        required: true

jobs:
  msix:
    name: MSIX ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    env:
      PROYECTO: src/Vortex.App/Vortex.App.csproj
      TFM: net10.0-windows10.0.19041.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Instalar workload de MAUI para Windows
        run: dotnet workload install maui-windows

      - name: Calcular versión
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Versión inválida: '$v' (se espera major.minor.build)" }
          "valor=$v" >> $env:GITHUB_OUTPUT

      # Los valores salen de Partner Center > Gestión de productos > Identidad del producto.
      # Se configuran como variables del repositorio (no son secretos).
      - name: Aplicar identidad de Microsoft Store
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          if (-not $env:STORE_IDENTITY_NAME -or -not $env:STORE_PUBLISHER -or -not $env:STORE_PUBLISHER_DISPLAY_NAME) {
            echo "::warning::Faltan las variables STORE_*: el MSIX se genera con identidad de prueba y la Store lo rechazará."
            exit 0
          }
          $ruta = 'src/Vortex.App/Platforms/Windows/Package.appxmanifest'
          [xml]$m = Get-Content $ruta
          $m.Package.Identity.Name = $env:STORE_IDENTITY_NAME
          $m.Package.Identity.Publisher = $env:STORE_PUBLISHER
          $m.Package.Properties.PublisherDisplayName = $env:STORE_PUBLISHER_DISPLAY_NAME
          $m.Save((Resolve-Path $ruta))

      - name: Generar MSIX
        run: >
          dotnet publish ${{ env.PROYECTO }} -f ${{ env.TFM }} -c Release
          -p:RuntimeIdentifierOverride=win-${{ matrix.arch }}
          -p:WindowsPackageType=MSIX
          -p:AppxPackageSigningEnabled=false
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.valor }}
          -p:AppxPackageDir=${{ github.workspace }}/artifacts/msix/

      - uses: actions/upload-artifact@v4
        with:
          name: vortex-crm-${{ steps.version.outputs.valor }}-${{ matrix.arch }}-msix
          # Solo el paquete de la app; Dependencies/ trae el Windows App Runtime, que la Store instala sola
          path: artifacts/msix/*/Vortex.App_*.msix
          if-no-files-found: error
