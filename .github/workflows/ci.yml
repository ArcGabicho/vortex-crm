name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  web-y-tests:
    name: Web + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compilar web
        run: dotnet build src/Vortex.Web/Vortex.Web.csproj -c Release
      - name: Tests
        run: dotnet test tests/Vortex.Shared.Tests/Vortex.Shared.Tests.csproj -c Release

  android:
    name: App Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - name: Instalar workload de MAUI para Android
        run: dotnet workload install maui-android
      - name: Compilar Android
        run: dotnet build src/Vortex.App/Vortex.App.csproj -f net10.0-android -c Release
